<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mains Mission · Live Test Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Firebase SDK (Compat versions) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>try{var _t=localStorage.getItem('mm_theme');if(_t){document.documentElement.setAttribute('data-theme',_t);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
<style>
:root{--bg:#f4f5fc;--bg2:#eceefa;--card:#ffffff;--ink:#171b38;--muted:#667094;--line:#e2e6f5;--brand:#4f46e5;--brand2:#7c3aed;--accent:#06b6d4;--pink:#ec4899;--O:#059669;--Obg:#d1fae5;--Ot:#065f46;--GS:#65a30d;--GSbg:#ecfccb;--GSt:#3f6212;--OK:#b45309;--OKbg:#fef3c7;--OKt:#92400e;--NI:#e11d48;--NIbg:#ffe4e6;--NIt:#9f1239;--shadow:0 16px 36px rgba(49,46,129,.09);--r:20px;color-scheme:light}
:root[data-theme="dark"]{--bg:#070b1a;--bg2:#101733;--card:#131b38;--ink:#eef0ff;--muted:#98a2cb;--line:#26315f;--O:#34d399;--Obg:#0d3b2c;--Ot:#a7f3d0;--GS:#a3e635;--GSbg:#1f3311;--GSt:#d9f99d;--OK:#fbbf24;--OKbg:#3b2f10;--OKt:#fcd34d;--NI:#fb7185;--NIbg:#3f1420;--NIt:#fecdd3;--shadow:0 18px 40px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);background-image:radial-gradient(900px 480px at 0% -10%,rgba(99,102,241,.14),transparent 60%),radial-gradient(800px 420px at 110% 0%,rgba(236,72,153,.10),transparent 55%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1220px;margin:0 auto;padding:0 16px}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:30px 0 96px;border-radius:0 0 36px 36px;background:linear-gradient(120deg,#1e1b4b,#4338ca 35%,#7c3aed 65%,#db2777);background-size:220% 220%;animation:aurora 16s ease infinite}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero:before{width:380px;height:380px;right:-90px;top:-130px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero:after{width:300px;height:300px;left:-80px;bottom:-140px;background:radial-gradient(circle,rgba(34,211,238,.35),transparent 65%)}
@keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero-in{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.88;font-weight:700}
.hero h1{margin:6px 0 4px;font-size:clamp(1.7rem,4.2vw,2.6rem);font-weight:900;line-height:1.1;letter-spacing:-.01em}
.tagline{margin:0;opacity:.94;max-width:640px}
.hero-tools{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap;backdrop-filter:blur(6px)}
.pill.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.28)}
.pill.warn{background:rgba(251,191,36,.28)}
.icon-btn{border:0;background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:1.05rem}
/* nav */
.nav{position:relative;z-index:2;margin-top:-54px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;gap:6px;padding:8px;overflow-x:auto;border:1px solid var(--line)}
.nav button{border:0;background:transparent;padding:10px 14px;border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.nav button:hover{background:var(--bg2);color:var(--ink)}
.nav button[aria-current="page"]{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.32)}
main{margin-top:18px;padding-bottom:30px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.g-side{grid-template-columns:1fr}}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0;animation:up .35s ease both}
.card h2{margin:0 0 4px;font-size:1.06rem;font-weight:800;letter-spacing:-.005em}
.card h3{margin:0;font-size:1rem;font-weight:700}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:.85rem}
.tile{position:relative;overflow:hidden;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#6366f1,#ec4899) border-box}
.tile .label{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.tile .big{font-size:2.05rem;font-weight:900;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#6366f1,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .hint{font-size:.8rem;color:var(--muted)}
.tile-ic{font-size:1.4rem}
.bigg{font-size:2.6rem;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#6366f1,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.gap{gap:8px}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--bg2);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--Obg);color:var(--Ot)}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.nt{background:#e0e7ff;color:#3730a3}
.chip.bad{background:var(--NIbg);color:var(--NIt)}
.chip.band.b-O{background:var(--Obg);color:var(--Ot);box-shadow:0 0 0 1px rgba(5,150,105,.25),0 0 14px rgba(16,185,129,.25)}
.chip.band.b-GS{background:var(--GSbg);color:var(--GSt)}
.chip.band.b-OK{background:var(--OKbg);color:var(--OKt)}
.chip.band.b-NI{background:var(--NIbg);color:var(--NIt)}
.chip.est{background:#fff7ed;color:#9a3412}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.25);transition:transform .15s ease,box-shadow .15s ease;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 24px rgba(79,70,229,.32)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--bg2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:linear-gradient(135deg,#e11d48,#be123c);box-shadow:0 8px 18px rgba(225,29,72,.25)}
.btn.small{padding:6px 10px;font-size:.8rem;border-radius:10px}
.btn.wide{width:100%}
input[type=text],input[type=number],input[type=search],select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
input:focus,select:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(129,140,248,.25)}
input[aria-invalid="true"]{border-color:var(--NI);box-shadow:0 0 0 3px rgba(225,29,72,.2)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.84rem;color:var(--muted);cursor:pointer}
.fchip[aria-pressed="true"]{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;flex:0 0 auto;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.bar{height:10px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22d3ee);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.sm{height:7px}
.bar.ok>span{background:linear-gradient(90deg,#34d399,#059669)}
.bar.bad>span{background:linear-gradient(90deg,#fb7185,#e11d48)}
.bar.gold>span{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute;text-align:center;line-height:1.1}
.ring .txt b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.ring .txt span{font-size:.72rem;color:var(--muted)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end}
.pod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pod.p1{padding-top:24px;transform:translateY(-12px);background:linear-gradient(180deg,rgba(251,191,36,.22),var(--card) 62%)}
.pod.p2{background:linear-gradient(180deg,rgba(148,163,184,.22),var(--card) 62%)}
.pod.p3{background:linear-gradient(180deg,rgba(251,146,60,.2),var(--card) 62%)}
.pod .medal{font-size:1.6rem}
.pod .score{font-size:1.55rem;font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px}
.pod .name{font-weight:800;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--bg2)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl button.linkish{border:0;background:none;padding:0;cursor:pointer;font-weight:800;color:var(--ink);text-align:left}
.tbl button.linkish:hover{color:var(--brand)}
.tbl tr.row-absent td{opacity:.55}
.wrapx{overflow-x:auto;border-radius:14px}
.tests-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.test-card{display:flex;flex-direction:column;gap:10px}
.plat-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;margin-top:6px}
/* entry table */
.cw{display:flex;gap:6px;justify-content:flex-end}
.cw input{width:60px;text-align:center;font-variant-numeric:tabular-nums}
.cw input[disabled]{opacity:.5}
.cwcell{min-width:150px}
.mini{font-size:.74rem;color:var(--muted);text-align:right;margin-top:4px;min-height:20px;display:flex;justify-content:flex-end;align-items:center;gap:4px;flex-wrap:wrap}
.mini.bad{color:var(--NI);font-weight:700}
.tot{font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
.tbl.entry td[data-tband]{text-align:right;margin-top:3px}
.num-in{width:86px}
.rank-in{width:100px;text-align:right}
/* banners, help, empties */
.banner{background:var(--bg2);color:var(--ink);padding:12px 14px;border-radius:14px;margin-top:14px;font-size:.9rem;border:1px solid var(--line)}
.banner.warn{background:var(--warnbg,#fef3c7);color:#92400e;border-color:transparent}
.motto{padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(79,70,229,.14),rgba(236,72,153,.1));border:1px solid var(--line);font-weight:700}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:4px}
.help{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-radius:14px;padding:12px 14px;font-size:.86rem;color:var(--muted)}
.help b{color:var(--ink)}
.plain{list-style:none;margin:0;padding:0}
.plain li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.plain li:last-child{border-bottom:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.sel-wide{min-width:220px}
/* insights */
.insights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.insights{grid-template-columns:1fr}}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}
.insight .ic{font-size:1.5rem;line-height:1}
.insight b{display:block;font-size:.92rem}
.insight span{font-size:.86rem;color:var(--muted)}
/* consistency wall */
.wall{display:grid;gap:12px}
.wall-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:center}
.wall-months{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px}
.wall-col{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.wall-lab{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.wall-grid{display:grid;grid-template-columns:repeat(3,16px);grid-auto-rows:16px;gap:4px}
.hc{width:16px;height:16px;border-radius:5px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s}
.hc:hover{transform:scale(1.25)}
.hc.hc-O{background:var(--O);box-shadow:0 0 10px rgba(16,185,129,.55)}
.hc.hc-GS{background:var(--GS)}
.hc.hc-OK{background:#d97706;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.hc.hc-NI{background:var(--NI)}
.hc.hc-none{background:repeating-linear-gradient(45deg,var(--bg2),var(--bg2) 3px,var(--line) 3px,var(--line) 4px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin:6px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* accuracy bars */
.abar{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:10px;align-items:center;margin:8px 0;font-size:.86rem}
.abar .bar{height:12px}
.abar .bar>span{background:linear-gradient(90deg,#22d3ee,#6366f1)}
.band-stack{display:flex;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.band-stack span{display:block;height:100%}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.compare-win{background:linear-gradient(90deg,rgba(16,185,129,.2),transparent);font-weight:800}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(10,12,30,.55);display:grid;place-items:center;z-index:60;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:20px;padding:22px;max-width:440px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal h3{margin:0 0 6px;font-size:1.1rem}
#toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;width:calc(100% - 32px);max-width:480px;pointer-events:none}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.3);font-weight:700;font-size:.9rem;animation:up .25s ease both;max-width:100%;text-align:center}
.toast.ok{background:linear-gradient(135deg,#065f46,#047857)}
.toast.warn{background:linear-gradient(135deg,#92400e,#b45309)}
.toast.out{opacity:0;transition:opacity .3s}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti span{position:absolute;top:-18px;width:9px;height:15px;border-radius:2px;animation-name:fall;animation-timing-function:cubic-bezier(.2,.6,.3,1);animation-fill-mode:forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(110vh) rotate(860deg);opacity:.15}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:up .35s ease both}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
.rules td,.rules th{font-size:.86rem}
.rules .tag{display:inline-block;min-width:98px;text-align:center}
@media (max-width:760px){
  .tbl.entry thead{display:none}
  .tbl.entry,.tbl.entry tbody,.tbl.entry tr,.tbl.entry td{display:block;width:100%}
  .tbl.entry tr{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px;background:var(--card);display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .tbl.entry td{border:0;padding:0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .tbl.entry td:first-child{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:8px}
  .tbl.entry td[data-label]:before{content:attr(data-label);font-size:.74rem;color:var(--muted);font-weight:700}
  .tbl.entry td.cwcell{grid-column:1/-1;display:block}
  .tbl.entry td.cwcell:before{display:block;margin-bottom:4px}
  .tbl.entry .cw{justify-content:flex-start}
  .tbl.entry .mini{justify-content:flex-start;text-align:left}
  .tbl.entry td .num-in,.tbl.entry td .rank-in{width:100px}
  .wall-row{grid-template-columns:1fr}
  .tbl.board thead{display:none}
  .tbl.board tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--card)}
  .tbl.board td{border:0;padding:0;display:flex;justify-content:space-between;gap:6px}
  .tbl.board td:first-child{grid-column:1/-1}
  .tbl.board td[data-label]:before{content:attr(data-label);color:var(--muted);font-size:.74rem}
  .podium .pod .score{font-size:1.2rem}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.livebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.live-dot{width:9px;height:9px;border-radius:50%;background:#10b981;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}70%{box-shadow:0 0 0 10px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  { id: 'board', label: 'Leaderboard', icon: '🏆' },
  { id: 'profile', label: 'Profile', icon: '👤' },
  { id: 'compare', label: 'Compare', icon: '⚔️' },

/* ================= State ================= */

  D: null, enter: { week: 'oct-t1', plat: 'tb', mode: 'mine', member: null }, enterTouched: false, topSnap: null, cheerReady: false, seenCheers: {}, draft: null,
  profileId: null, compareA: null, compareB: null,
  hist: { week: 'all', plat: 'all', member: 'all', q: '' },

/* ================= Helpers ================= */
function $(sel, root) { return (root || document).querySelector(sel); }

// A subject's marks come from Correct and Wrong: 3 per correct, minus 1 per wrong, 0 for unattempted.
// Older rows (marks typed directly, no Correct/Wrong) are kept as "marks only".

  var sub = d.sub;
  if (!sub) {
    // the first version of the tracker stored marks directly
    sub = { maths: { m: d.maths }, reasoning: { m: d.reasoning }, english: { m: d.english }, ga: { m: d.ga }, computer: { m: d.computer } };

}
// Section marks are typed from the scorecard. Whole-test counts (Correct and Wrong) are typed once per test.
// Attempted, not attempted and accuracy are worked out from those counts.
function computeRecord(src) {
  var s = {};
  var perSection = true, cSum = 0, wSum = 0, qSum = 0;
  SUBJECTS.forEach(function (sj) {
    var raw = src.sub[sj.k] || {};

/* ================= Feedback ================= */
function toast(msg, kind) {
  var t = h('div', { class: 'toast ' + (kind || '') }, [msg]);
  $('#toasts').appendChild(t);
  setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 320); }, 3400);
}
function errorToast(e) {
  var c = e && e.code;
  if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted') {
    setReadOnly(true);
    toast('Your access lets you view the tracker, but not change shared data. Ask the admin for Contributor access.', 'warn');
  } else if (c === 'quota_exceeded') toast('Shared storage is full. Delete some old entries first.', 'warn');
  else if (c === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.', 'warn');
  else toast('Could not save just now. Please try again.', 'warn');
}
async function run(fn, okMsg) {
  try {
    await fn();
    if (S.mode === 'local') render(true);
    if (okMsg) toast(okMsg, 'ok');
    return true;
  } catch (e) {
    errorToast(e);
    return false;
  }
}
function setReadOnly(v) { if (S.readOnly !== v) { S.readOnly = v; render(true); } }
function confirmBox(title, text, okLabel, onOk, danger) {

  var box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, [
    h('h3', {}, [title]),
    h('p', { class: 'muted' }, [text]),
    h('div', { class: 'row end gap', style: { marginTop: '14px' } }, [
      h('button', { class: 'btn ghost', type: 'button', onclick: function () { close(); } }, ['Cancel']),
      h('button', { class: 'btn ' + (danger ? 'danger' : ''), type: 'button', onclick: function () { close(); onOk(); } }, [okLabel])
    ])
  ]);
  back.appendChild(box);
  function close() { back.remove(); }
  $('#modal').appendChild(back);
}
function celebrate(text) {
  var reduce = false;
  try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
  toast('😍 Outstanding! ' + text, 'ok');
  if (reduce) return;
  var layer = h('div', { class: 'confetti', 'aria-hidden': 'true' });

/* ================= Live data ================= */
function subscribeDb() {
  var timer = setTimeout(function () { if (!allLoaded()) { S.slow = true; renderBanner(); } }, 10000);
  function settle() { if (allLoaded()) { clearTimeout(timer); S.slow = false; } renderPill(); renderBanner(); }
  function onErr(e) {
    if (e && e.code === 'revoked') setReadOnly(true);
    if (e && e.code === 'unavailable') { S.slow = true; renderBanner(); }
  }
  CAP.db.collection('members').onSnapshot(function (snap) {
    S.members = snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    S.loaded.members = true; settle(); scheduleRender();
  }, onErr);
  CAP.db.collection('scores').onSnapshot(function (snap) {
    S.scores = snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    S.loaded.scores = true; settle(); scheduleRender();
  }, onErr);
  CAP.db.doc('settings/schedule').onSnapshot(function (snap) {
    var d = snap.exists ? snap.data() : null;
    S.labels = d && d.labels ? d.labels : {};
    S.loaded.labels = true; settle(); scheduleRender();
  }, onErr);
  CAP.db.doc('settings/app').onSnapshot(function (snap) {
    if (snap.exists) S.settings = Object.assign({ groupName: 'Our Mains Squad' }, snap.data());
    S.loaded.settings = true; settle(); scheduleRender();
  }, onErr);
}

    db.collection('scores').onSnapshot(function(snap) {

    db.doc('settings/schedule').onSnapshot(function(doc) {

    db.doc('settings/app').onSnapshot(function(doc) {

  } catch (e) {

    S.members = lsGet('mm_members', []);
    S.scores = lsGet('mm_scores', []);
    S.labels = lsGet('mm_labels', {});

}

async function addMember(raw) {

  if (S.members.length >= MAX_MEMBERS) { toast('The team is full (20 members).', 'warn'); return; }

  while (S.members.some(function (m) { return m.slot === slot; }) && slot < 50) slot++;

  while (S.members.some(function (m) { return m.id === id; })) { slot++; id = 'm' + slot; }
  await run(function () { return putMember({ id: id, name: name, color: COLORS[(slot - 1) % COLORS.length], slot: slot }); }, name + ' added to the team');
}
